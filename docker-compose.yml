version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: riego_db
    environment:
      POSTGRES_DB: riego_inteligente
      POSTGRES_USER: riego_admin
      POSTGRES_PASSWORD: morelos2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riego_admin -d riego_inteligente"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: riego_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: riego_admin
      DB_PASSWORD: morelos2024
      DB_DATABASE: riego_inteligente
      WEATHER_API_KEY: ${WEATHER_API_KEY:-demo}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    container_name: riego_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
